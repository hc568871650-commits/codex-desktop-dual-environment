name: Windows launcher checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test shortcut encoding on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Trace-ShortcutEncoding.ps1
      - name: Run all controller checks in isolated PowerShell processes
        timeout-minutes: 12
        shell: powershell
        run: ./tests/Test-All.ps1
      - name: Test isolated question bridge with fixtures
        timeout-minutes: 4
        shell: powershell
        run: |
          foreach ($test in @('Test-BridgeTransport','Test-TrialRecovery','Test-QuestionClient','Test-ControllerQuestions')) {
            & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "./experiments/notification-bridge/tests/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
      - name: Build release
        shell: powershell
        run: |
          ./scripts/Build-Release.ps1
          ./scripts/Build-UpgradePackage.ps1
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: test-results/validation-*/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: CodexDualLauncher-windows
          path: dist/*.zip
