name: Windows launcher checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test core on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Core.ps1
      - name: Build portable archive
        shell: powershell
        run: ./tests/Test-Instances.ps1 -Integration
      - name: Test deployment lifecycle
        shell: powershell
        run: |
          ./tests/Trace-ShortcutEncoding.ps1
          ./tests/Test-Install.ps1
      - name: Test tray lifecycle
        shell: powershell
        run: ./tests/Test-Controller.ps1
      - name: Test 0.3 experience and configuration isolation
        shell: powershell
        run: ./tests/Test-Experience.ps1
      - name: Test compiled controller interactions
        shell: powershell
        run: ./tests/Test-Host.ps1
      - name: Test automatic setup and exit responsiveness
        shell: powershell
        run: |
          ./tests/Test-Setup.ps1
          ./tests/Test-ExitUi.ps1
      - name: Package
        shell: powershell
        run: ./tests/Test-Upgrade.ps1
      - name: Build release
        shell: powershell
        run: |
          ./scripts/Build-Release.ps1
          ./scripts/Build-UpgradePackage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexDualLauncher-windows
          path: dist/*.zip
